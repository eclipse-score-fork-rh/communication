# Packit configuration for automated Copr builds
# This configuration is used to build RPMs on CentOS Stream and EPEL

upstream_project_url: https://github.com/eclipse-score-fork-rh/communication
upstream_package_name: lola-devel

# Since we're using Bazel to generate the SRPM, we'll use the prebuilt SRPM
# from the continuous release instead of having packit generate it
srpm_build_deps: []

jobs:
  # Build on Copr when SRPM is available from continuous release
  - job: copr_build
    trigger: commit
    targets:
      - centos-stream-10-x86_64
      - centos-stream-9-x86_64
      - epel-10-x86_64
      - epel-9-x86_64

  # Optionally build on pull requests
  - job: copr_build
    trigger: pull_request
    targets:
      - centos-stream-10-x86_64
      - centos-stream-9-x86_64
      - epel-10-x86_64
      - epel-9-x86_64

# Actions for different events
actions:
  # Since Bazel generates the SRPM, we don't need packit to create it
  # We'll reference the SRPM from the continuous release
  create-archive:
    - bash -c "echo 'SRPM created by Bazel CI'"
